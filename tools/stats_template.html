<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>자격정보 서비스 방문 통계</title><style>
:root{--ink:#1F3A5F;--ink2:#3E6DA8;--gold:#B8860B;--line:#C9CDD4;--bg:#FBFBF8;--card:#FFFFFF}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(1200px 500px at 50% -10%,#EEF3FA 0%,transparent 60%),
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,58,95,.035) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(31,58,95,.035) 31px 32px),
  var(--bg);
  color:#1c232e;font:14.5px/1.6 -apple-system,"Malgun Gothic","Noto Sans CJK KR",sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:30px 20px 70px}
.mast{text-align:center;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:20px 0 14px;position:relative;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}
.mast:after{content:"";position:absolute;left:20%;right:20%;bottom:4px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mast h1{margin:0;font:700 29px/1.3 "Nanum Myeongjo","Noto Serif CJK KR",serif;color:var(--ink);letter-spacing:.14em}
.mast .sub{margin-top:7px;color:#5A6472;font-size:12px;letter-spacing:.05em}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:var(--ink2);border:1px solid #D7E0EC;background:#fff;border-radius:999px;padding:3px 12px}
.live i{width:7px;height:7px;border-radius:50%;background:#2E8B57;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,139,87,.5)}70%{box-shadow:0 0 0 8px rgba(46,139,87,0)}100%{box-shadow:0 0 0 0 rgba(46,139,87,0)}}
.tabs{display:flex;justify-content:center;gap:8px;margin:18px 0 6px}
.tab{cursor:pointer;border:1px solid var(--line);background:#fff;padding:9px 22px;font:700 14px/1 "Nanum Myeongjo",serif;color:#5A6472;letter-spacing:.1em;transition:all .25s}
.tab small{display:block;font:600 9px/1 sans-serif;letter-spacing:.22em;color:#9AA6B4;margin-top:4px}
.tab.on{color:#fff;background:linear-gradient(150deg,var(--ink),var(--ink2));border-color:var(--ink);box-shadow:0 8px 18px -10px rgba(31,58,95,.6)}
.tab.on small{color:#CBD8EA}
.panel{display:none}.panel.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.box{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink);padding:14px 16px 16px;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.box.in{opacity:1;transform:none}
h2{font:700 18px/1.3 "Nanum Myeongjo",serif;color:var(--ink);margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
h2 .desc{font:400 11.5px/1 sans-serif;color:#5A6472}
h2 .badge{margin-left:auto;font:700 10px/1 sans-serif;letter-spacing:.1em;color:#fff;background:linear-gradient(135deg,var(--ink),var(--ink2));border-radius:3px;padding:3px 7px}
.mini{display:flex;gap:8px;margin:10px 0}
.mini>div{flex:1;border:1px solid #E6E9EE;background:#FCFDFE;padding:8px 10px}
.mini .k{font-size:10.5px;color:#5A6472;letter-spacing:.06em}
.mini .v{font:700 20px/1.25 "Nanum Myeongjo",serif;color:var(--ink);font-variant-numeric:tabular-nums}
.mini .v small{font:400 11px/1 sans-serif;color:#8A93A0}
h3{font:700 13.5px/1.3 "Nanum Myeongjo",serif;color:var(--ink);border-left:3px solid var(--gold);padding-left:8px;margin:14px 0 8px}
.chart{position:relative}.chart svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;transform:translate(-50%,-125%);white-space:nowrap;opacity:0;transition:opacity .15s;z-index:5}
table{width:100%;border-collapse:collapse;background:var(--card)}
td,th{padding:7px 8px;border-bottom:1px solid #EDEEF0;vertical-align:middle;text-align:left;font-size:13px}
th{font-size:11px;color:#5A6472;letter-spacing:.05em;border-bottom:1.5px solid var(--line)}
.rk{width:32px;text-align:center;font-weight:800;color:var(--ink)}
.rk b{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;font-size:11px}
.r1 .rk b{background:linear-gradient(135deg,#F3C14B,#B8860B);color:#fff}.r2 .rk b{background:linear-gradient(135deg,#CFD6DE,#9AA6B4);color:#fff}.r3 .rk b{background:linear-gradient(135deg,#D8A47F,#A0612F);color:#fff}
.cd{color:#8A93A0;font-size:11px}
.ct{text-align:right;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar i{display:block;height:9px;width:0;background:linear-gradient(90deg,var(--ink),var(--ink2));border-radius:2px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.none{text-align:center;color:#8A93A0}
.wait{border:1.2px dashed #B8BFC9;background:rgba(255,255,255,.7);color:#5A6472;padding:24px;text-align:center;font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 12px;background:var(--card);border:1px solid var(--line);padding:10px 12px}
.seg{display:flex;border:1px solid var(--line);overflow:hidden;border-radius:4px}
.seg button{border:0;background:#fff;color:#5A6472;font:600 12px/1 sans-serif;padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.ctl label{font-size:11px;color:#5A6472;letter-spacing:.06em;margin-left:4px}
.pick{margin-left:auto;display:flex;gap:6px;align-items:center}
.pick input{border:1px solid var(--line);padding:7px 10px;font-size:13px;width:230px;background:#fff}
.deep .box{opacity:1;transform:none}
.tblwrap{max-height:340px;overflow:auto;border:1px solid var(--line)}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.foot{margin-top:36px;padding-top:12px;border-top:1px solid var(--line);color:#5A6472;font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
@media(max-width:860px){.grid2,.focus{grid-template-columns:1fr}.pick{margin-left:0}.pick input{width:160px}.mast h1{font-size:23px;letter-spacing:.08em}}
@media print{body{background:#fff}.box{opacity:1;transform:none}.bar i{transition:none}.panel{display:block!important}.tabs{display:none}}
</style></head><body><div class="wrap">
<div class="mast"><h1>자격정보 서비스 방문 통계</h1>
<div class="sub">Q-PAGE · Q-RADAR 통합 관제 · 집계 개시 <b id="since"></b> · 쿠키 없는 비식별 집계 · 일별 원장 자체 보존(전 기간 누적)</div>
<div class="live"><i></i>오늘 실시간분 포함 · 생성 <span id="gen"></span> KST</div></div>
<div class="tabs">
  <div class="tab on" data-p="ov">관측 요약<small>OVERVIEW</small></div>
  <div class="tab" data-p="dp">심층 탐사<small>DEEP DIVE</small></div>
</div>
<div class="panel on" id="p-ov"><div class="grid2" id="ovgrid"></div></div>
<div class="panel deep" id="p-dp">
  <div class="ctl">
    <div class="seg" id="segSite"></div><label>대상</label>
    <div class="seg" id="segRange"><button data-v="7">7일</button><button data-v="30" class="on">30일</button><button data-v="90">90일</button><button data-v="0">전체</button></div><label>기간</label>
    <div class="seg" id="segUnit"><button data-v="d" class="on">일별</button><button data-v="m">월별</button></div><label>단위</label>
    <div class="pick"><input id="qpick" list="qlist" placeholder="종목 검색 (이름·코드)"><datalist id="qlist"></datalist></div>
  </div>
  <div class="box in"><h3 id="bigTitle">기간 방문 추이</h3><div class="chart" id="bigChart"></div></div>
  <div class="focus" style="margin-top:16px">
    <div class="box in"><h3 id="rankTitle">기간 내 조회 순위</h3><div class="tblwrap"><table id="rankTbl"></table></div></div>
    <div class="box in"><h3>종목별 조회 추적</h3><div id="qFocus" class="none" style="padding:30px 0">위 검색창에서 종목을 선택하세요</div></div>
  </div>
</div>
<div class="foot"><span>원천: GoatCounter(개인정보·쿠키 미수집) · 일별 사본을 저장소에 적층해 전 기간 이력 보존 · 매시 자동 갱신</span><span>© HRDK Q-PAGE</span></div>
</div>
<script>
var DATA = __DATA__;
var NM = DATA.nmap || {};
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function fmt(n){return (n||0).toLocaleString("ko-KR");}
function nameOf(c){var m=NM[c];return m?m.nm+(m.et==="과정형"?" <span class=cd>"+c+"·과정평가형</span>":" <span class=cd>"+c+"</span>"):c;}
function countUp(node,to){var t0=null,d=800;function s(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/d);p=1-Math.pow(1-p,3);node.textContent=fmt(Math.round(to*p));if(p<1)requestAnimationFrame(s);}requestAnimationFrame(s);}
function lineChart(box,pts,h,opts){ /* pts:[{x,label,n}] */
  opts=opts||{};var W=opts.w||860,H=h||170,P=30,n=pts.length;
  var mx=Math.max.apply(null,pts.map(function(p){return p.n;}).concat([1]));
  function X(i){return n<2?W/2:P+i*(W-2*P)/(n-1);}
  function Y(v){return H-26-(v/mx)*(H-54);}
  var poly=pts.map(function(p,i){return X(i)+","+Y(p.n);}).join(" ");
  var area="M"+X(0)+","+(H-26)+" L"+poly.split(" ").join(" L")+" L"+X(n-1)+","+(H-26)+" Z";
  var dots=pts.map(function(p,i){return '<circle class="pt" data-l="'+p.label+'" data-n="'+p.n+'" cx="'+X(i)+'" cy="'+Y(p.n)+'" r="3.6" fill="#1F3A5F"/>';}).join("");
  var step=Math.ceil(n/14);
  var labs=pts.map(function(p,i){return (i%step)?"":'<text x="'+X(i)+'" y="'+(H-8)+'" font-size="10" fill="#8A93A0" text-anchor="middle">'+p.x+'</text>';}).join("");
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="g'+H+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E6DA8" stop-opacity=".33"/><stop offset="1" stop-color="#3E6DA8" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#g'+H+')"/><polyline points="'+poly+'" fill="none" stroke="#1F3A5F" stroke-width="2.2" stroke-linejoin="round"/>'+dots+labs+'</svg>';
  attachTip(box);
}
function barChart(box,pts,h){
  var W=860,H=h||170,P=30,n=pts.length;
  var mx=Math.max.apply(null,pts.map(function(p){return p.n;}).concat([1]));
  var bw=Math.min(54,(W-2*P)/n*0.62);
  var bars=pts.map(function(p,i){var x=P+(i+0.5)*(W-2*P)/n, bh=(p.n/mx)*(H-54);
    return '<rect class="pt" data-l="'+p.label+'" data-n="'+p.n+'" x="'+(x-bw/2)+'" y="'+(H-26-bh)+'" width="'+bw+'" height="'+bh+'" rx="2" fill="url(#bg)"/>' +
           '<text x="'+x+'" y="'+(H-8)+'" font-size="10" fill="#8A93A0" text-anchor="middle">'+p.x+'</text>';}).join("");
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E6DA8"/><stop offset="1" stop-color="#1F3A5F"/></linearGradient></defs>'+bars+'</svg>';
  attachTip(box);
}
function attachTip(box){
  var tip=box.querySelector(".tip")||box.appendChild(el("div","tip"));
  box.onmousemove=function(ev){var t=ev.target;
    if(t.classList&&t.classList.contains("pt")){var r=box.getBoundingClientRect(),b=t.getBoundingClientRect();
      tip.style.left=(b.left-r.left+b.width/2)+"px";tip.style.top=(b.top-r.top)+"px";
      tip.innerHTML=t.dataset.l+" · <b>"+fmt(+t.dataset.n)+"회</b>";tip.style.opacity=1;}
    else tip.style.opacity=0;};
  box.onmouseleave=function(){tip.style.opacity=0;};
}
/* ───────── 관측 요약 ───────── */
var ovg=document.getElementById("ovgrid");
DATA.sites.forEach(function(s){
  var box=el("div","box");
  box.appendChild(el("h2",null,s.label+' <span class="desc">'+s.desc+'</span>'+(s.status==="on"?'<span class="badge">LIVE</span>':"")));
  if(s.status!=="on"){box.appendChild(el("p","wait","집계 적용 대기 중"));}
  else{
    var mini=el("div","mini");
    [["누적 방문",s.total,"회"],["상세 조회",s.qsum,s.qcnt+"종목"],["홈 조회",s.home,"회"]].forEach(function(c){
      var d=el("div",null,'<div class="k">'+c[0]+'</div><div class="v"><span class="num" data-to="'+c[1]+'">0</span> <small>'+c[2]+'</small></div>');mini.appendChild(d);});
    box.appendChild(mini);
    box.appendChild(el("h3",null,"일별 추이"));
    var ch=el("div","chart");box.appendChild(ch);
    lineChart(ch,s.days.map(function(d){return{x:d.d.slice(5).replace("-","/"),label:d.d,n:d.n};}),120,{w:480});
    box.appendChild(el("h3",null,"최다 조회 TOP 5"));
    var mx=Math.max.apply(null,s.top.slice(0,5).map(function(x){return x.n;}).concat([1]));
    var tr=s.top.slice(0,5).map(function(x,i){return '<tr class="r'+(i+1)+'"><td class="rk"><b>'+(i+1)+'</b></td><td>'+nameOf(x.c)+'</td><td class="ct">'+fmt(x.n)+'</td><td class="bar" style="width:30%"><i data-w="'+(x.n/mx*100).toFixed(0)+'"></i></td></tr>';}).join("")||'<tr><td class="none">기록 없음</td></tr>';
    box.appendChild(el("table",null,tr));
  }
  ovg.appendChild(box);
});
/* ───────── 심층 탐사 ───────── */
var LIVE=DATA.sites.filter(function(s){return s.status==="on";});
var st={site:0,range:30,unit:"d",q:null};
var segS=document.getElementById("segSite");
LIVE.forEach(function(s,i){var b=el("button",i===0?"on":"",s.label);b.dataset.v=i;segS.appendChild(b);});
function segBind(id,key,cast){document.getElementById(id).addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  this.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});b.classList.add("on");
  st[key]=cast(b.dataset.v);renderDeep();});}
segBind("segSite","site",Number);segBind("segRange","range",Number);segBind("segUnit","unit",String);
var dl=document.getElementById("qlist");
Object.keys(NM).sort().forEach(function(c){var o=document.createElement("option");o.value=NM[c].nm+" ("+c+")";dl.appendChild(o);});
document.getElementById("qpick").addEventListener("change",function(){
  var m=this.value.match(/\(([0-9A-Z]{4})\)\s*$/);st.q=m?m[1]:null;renderDeep();});
function slice(s){var ds=s.days;return st.range?ds.slice(-st.range):ds;}
function monthly(ds){var m={};ds.forEach(function(d){var k=d.d.slice(0,7);if(!m[k])m[k]={d:k,n:0,q:{}};m[k].n+=d.n;
  for(var c in d.q)m[k].q[c]=(m[k].q[c]||0)+d.q[c];});return Object.keys(m).sort().map(function(k){return m[k];});}
function renderDeep(){
  var s=LIVE[st.site];if(!s)return;
  var ds=slice(s), pts=st.unit==="m"?monthly(ds):ds;
  var label=st.range?("최근 "+st.range+"일"):"전체 기간";
  document.getElementById("bigTitle").textContent=s.label+" · "+label+" 방문 추이 ("+(st.unit==="m"?"월별":"일별")+")";
  var big=document.getElementById("bigChart");
  var cps=pts.map(function(p){return{x:(st.unit==="m"?p.d.slice(2):p.d.slice(5).replace("-","/")),label:p.d,n:p.n};});
  (st.unit==="m"?barChart:lineChart)(big,cps,190);
  var agg={};ds.forEach(function(d){for(var c in d.q)agg[c]=(agg[c]||0)+d.q[c];});
  var arr=Object.keys(agg).map(function(c){return{c:c,n:agg[c]};}).sort(function(a,b){return b.n-a.n;});
  var tot=arr.reduce(function(a,x){return a+x.n;},0)||1;
  document.getElementById("rankTitle").textContent=label+" 조회 순위 · "+fmt(arr.length)+"개 종목";
  document.getElementById("rankTbl").innerHTML='<tr><th></th><th>종목</th><th style="text-align:right">조회</th><th style="text-align:right">점유</th></tr>'
    +(arr.map(function(x,i){return '<tr class="r'+(i+1)+'"><td class="rk"><b>'+(i+1)+'</b></td><td>'+nameOf(x.c)+'</td><td class="ct">'+fmt(x.n)+'</td><td class="ct" style="color:#5A6472;font-weight:400">'+(x.n/tot*100).toFixed(1)+'%</td></tr>';}).join("")||'<tr><td colspan="4" class="none">기간 내 기록 없음</td></tr>');
  var f=document.getElementById("qFocus");
  if(!st.q){f.className="none";f.style.padding="30px 0";f.textContent="위 검색창에서 종목을 선택하세요";return;}
  var qds=ds.map(function(d){return{x:d.d.slice(5).replace("-","/"),label:d.d,n:(d.q[st.q]||0)};});
  var sum=qds.reduce(function(a,p){return a+p.n;},0);
  var all=s.days.reduce(function(a,d){return a+(d.q[st.q]||0);},0);
  var peak=qds.reduce(function(a,p){return p.n>a.n?p:a;},{n:0,label:"-"});
  f.className="";f.style.padding="0";
  f.innerHTML='<div style="font:700 15px/1.4 Nanum Myeongjo,serif;color:var(--ink);margin-bottom:6px">'+nameOf(st.q)+'</div>'
    +'<div class="mini"><div><div class="k">'+label+' 조회</div><div class="v">'+fmt(sum)+'</div></div><div><div class="k">전 기간 누적</div><div class="v">'+fmt(all)+'</div></div><div><div class="k">최다일</div><div class="v" style="font-size:14px">'+peak.label+'<small> '+fmt(peak.n)+'회</small></div></div></div>'
    +'<div class="chart" id="qchart"></div>';
  lineChart(document.getElementById("qchart"),qds,120,{w:480});
}
renderDeep();
/* 탭 전환(+주소 해시 연동) */
function openTab(p){document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.p===p);});
  document.querySelectorAll(".panel").forEach(function(x){x.classList.remove("on");});
  document.getElementById("p-"+p).classList.add("on");
  if(history.replaceState)history.replaceState(null,"",p==="dp"?"#deep":"#");}
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){openTab(t.dataset.p);});});
if(location.hash==="#deep")openTab("dp");
document.getElementById("since").textContent=DATA.since;
document.getElementById("gen").textContent=DATA.gen;
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var b=e.target;b.classList.add("in");
  b.querySelectorAll(".num").forEach(function(n){countUp(n,+n.dataset.to);});
  setTimeout(function(){b.querySelectorAll(".bar i").forEach(function(i){i.style.width=i.dataset.w+"%";});},200);
  io.unobserve(b);}});},{threshold:.12});
document.querySelectorAll("#p-ov .box").forEach(function(b){io.observe(b);});
setTimeout(function(){document.querySelectorAll(".box:not(.in)").forEach(function(b){b.classList.add("in");b.querySelectorAll(".num").forEach(function(x){x.textContent=fmt(+x.dataset.to);});b.querySelectorAll(".bar i").forEach(function(x){x.style.width=x.dataset.w+"%";});});},2300);
</script></body></html>
