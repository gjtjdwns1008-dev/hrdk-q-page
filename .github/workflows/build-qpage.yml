# .github/workflows/build-qpage.yml  (v5)
# v5 변경(2026-11): 종목별 PDF를 더는 업로드하지 않는다 —
#   배포 때 외부공개 HTML(내장 자료)에서 A3 원페이지 PDF 전 종목을 자동 생성하고
#   (tools/build_sheet.py 조판 + tools/build_sheets.py 일괄 생성·검산, 약 6분),
#   기존 PNG 변환·주소 체계는 그대로 승계한다. 자료·도구가 안 바뀐 날(매일 예약 실행)은
#   캐시 재사용으로 생성을 건너뛴다. 과도기 폴백: 생성물이 없으면 저장소 pdf/ 를 쓴다.
# ───────────────────────────────────────────────────────────────
# 하는 일: pdf/ 의 종목별 화면 PDF → PNG 변환 + 최신 외부공개 HTML을 묶어
#          dist/ 를 만들고 GitHub Pages로 배포한다.
#
# 실행 규칙(v4):
#   · 매일 1회 예약 실행(09:23 KST) → 우대법령 오버레이 최신 반영
#     (Q-Radar가 일 4회 게시하는 pref_export.json 을 배포 시점에 주입)
#     ※ v4.1: 05:23 → 09:23 으로 이동. Q-Radar 당일 첫 게시가 08시경이라
#       05시에 돌면 늘 전날 스냅샷을 집어왔다(2026-09-13 확인).
#   · q-page-outside_YYYY-MM-DD.html "추가/수정" 커밋 → 본작업 실행
#   · 감시 파일의 "삭제만" 있는 커밋 → 문지기가 10초 만에 본작업 생략
#     (깃허브 push 감시는 추가·수정·삭제를 구분하지 못하므로,
#      이벤트는 뜨되 커밋 내용을 열어 삭제뿐이면 건너뛴다)
#   · pdf/ 업로드는 애초에 실행을 일으키지 않는다(감시 목록 밖)
#   · Actions 탭 수동 실행(Run workflow)은 항상 본작업 실행
#   ※ 최신본을 삭제해 이전 날짜본으로 되돌리고 싶을 때는 수동 실행 1회.
#
# 실패 진단(v3): PDF→PNG 변환이 실패해도 Summary 에
#   변환 결과(실패 파일 목록 포함)를 반드시 출력한 뒤 실패 처리한다.
#
# 우대법령 오버레이(v4): tools/pref_inject.py 가 명찰(qpage-master)을 읽어
#   dist/index.html 에만 pref_law 를 주입한다. 다운로드·검산이 하나라도
#   실패하면 경고만 남기고 순정본을 그대로 배포한다(규격 v1.4 §3 폴백).
#   저장소의 원본 HTML 은 어떤 경우에도 수정되지 않는다.
#
# 파일 규약: 날짜상 가장 최신 q-page-outside 파일이 index.html 로 배포.
# 안전장치: q-page-inside* / *내부용*.html 발견 시 배포 강제 중단.
# 사전 1회 설정: Settings → Pages → Source = "GitHub Actions".
# ───────────────────────────────────────────────────────────────
name: Build & Deploy Q-Page 자격정보집

on:
  schedule:
    - cron: '23 0 * * *'    # 매일 09:23 KST(=00:23 UTC) — 우대법령 최신 반영(빌드 전체 재수행)
  workflow_dispatch:
    inputs:
      dpi:
        description: '화면 PNG 해상도. 기본 200 — 폰에서 2배 확대까지 글자가 버팁니다'
        default: '200'
      pages:
        description: 'first=첫 쪽만 PNG(기본) · all=모든 쪽 PNG'
        default: 'first'
  push:
    branches: [ main ]
    paths:
      - 'q-page-outside_*.html'
      - 'tools/**'
      - '.github/workflows/build-qpage.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - name: 코드 체크아웃(직전 커밋 포함)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 삭제 전용 커밋인지 판별
        id: d
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "수동/예약 실행 → 본작업 진행"; exit 0
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "비교 대상 없음 → 본작업 진행"; exit 0
          fi
          CH=$(git diff --name-status HEAD^ HEAD -- 'q-page-outside_*.html' tools .github/workflows/build-qpage.yml || true)
          echo "감시 경로 변경분:"; printf '%s\n' "$CH"
          if [ -z "$(printf '%s' "$CH" | tr -d '[:space:]')" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "판별 불가(여러 커밋 묶음 등) → 안전하게 진행"; exit 0
          fi
          NONDEL=$(printf '%s\n' "$CH" | grep -v '^D' | grep -v '^$' | head -1 || true)
          if [ -n "$NONDEL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "추가/수정 감지 → 본작업 진행"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### 배포 생략"
              echo "이번 커밋은 감시 파일의 **삭제만** 포함 → 변환·배포를 건너뜁니다."
              echo "(삭제로 이전 날짜본을 다시 내보내려면 Run workflow 수동 실행 1회)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "삭제만 감지 → 본작업 생략"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Pages 프로비저닝 확인/강제 (신규 레포 첫 배포 대비)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PDF 변환 도구 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils pngquant fonts-noto-cjk

      - name: A3 원페이지 PDF 캐시 (자료·도구가 그대로면 재생성 생략)
        uses: actions/cache@v4
        with:
          path: a3pdf
          key: a3pdf-${{ hashFiles('q-page-outside_*.html', 'tools/build_sheet.py', 'tools/build_sheets.py') }}

      - name: A3 원페이지 PDF 생성 (외부공개 HTML 내장 자료에서 직접)
        run: |
          if [ -n "$(ls -A a3pdf/*.pdf 2>/dev/null)" ]; then
            echo "캐시 재사용: A3 PDF $(ls a3pdf/*.pdf | wc -l)장 (화면 자료·도구 변경 없음)"
            echo '### A3 원페이지 PDF — 캐시 재사용 (자료 변경 없음)' >> "$GITHUB_STEP_SUMMARY"
          else
            LATEST=$(ls q-page-outside_*.html 2>/dev/null | sort | tail -1)
            if [ -z "$LATEST" ]; then
              echo "::error::q-page-outside_YYYY-MM-DD.html 파일이 저장소 루트에 없습니다."; exit 1
            fi
            pip install -q playwright
            python -m playwright install --with-deps chromium
            set +e
            python tools/build_sheets.py "$LATEST" a3pdf 2>&1 | tee a3gen.log
            RC=${PIPESTATUS[0]}
            set -e
            {
              echo '### A3 원페이지 PDF 생성'
              echo "원천: \`$LATEST\`"
              echo '```'
              tail -15 a3gen.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$RC" -ne 0 ]; then
              echo "::error::A3 PDF 생성이 실패했습니다(수량·1페이지 검산 포함). Summary를 확인하세요."
              exit "$RC"
            fi
          fi

      - name: A3 PDF 묶음 보관 (점검용 · 7일 — 필요 없으면 이 단계 삭제)
        uses: actions/upload-artifact@v4
        with:
          name: a3-onepage-pdf
          path: a3pdf
          retention-days: 7

      - name: 변환 결과 캐시 (자료가 그대로면 PNG도 다시 만들지 않도록)
        uses: actions/cache@v4
        with:
          path: dist/sheets
          key: sheets-${{ inputs.dpi || '200' }}-${{ inputs.pages || 'first' }}-${{ hashFiles('q-page-outside_*.html', 'tools/build_sheet.py', 'tools/build_sheets.py') }}
          restore-keys: sheets-${{ inputs.dpi || '200' }}-${{ inputs.pages || 'first' }}-

      - name: 화면 PDF → PNG 변환 (실패해도 Summary에 결과 기록)
        run: |
          SRCDIR=a3pdf
          if [ -z "$(ls -A a3pdf/*.pdf 2>/dev/null)" ]; then
            if [ -d pdf ] && [ -n "$(ls -A pdf/*.pdf 2>/dev/null)" ]; then
              SRCDIR=pdf
              echo "::warning::생성된 A3 PDF가 없어 저장소 pdf/ 폴더로 폴백합니다(과도기 안전망)."
            else
              SRCDIR=""
            fi
          fi
          if [ -n "$SRCDIR" ]; then
            set +e
            python tools/pdf_to_png.py "$SRCDIR" dist/sheets \
              --dpi "${{ inputs.dpi || '200' }}" \
              --pages "${{ inputs.pages || 'first' }}" 2>&1 | tee convert.log
            RC=${PIPESTATUS[0]}
            set -e
            {
              echo '### 화면 PNG 변환'
              echo "종료 코드: $RC"
              echo '```'
              sed -n '/\[변환 결과\]/,$p' convert.log | tail -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$RC" -ne 0 ]; then
              echo "::error::PDF→PNG 변환이 실패했습니다. Summary의 변환 결과에서 실패 파일을 확인하세요."
              exit "$RC"
            fi
          else
            echo "변환할 PDF가 없습니다(생성물·pdf/ 모두 빈 상태). 화면 원본 없이 배포합니다."
            echo '### 화면 PNG 변환 — 건너뜀 (PDF 없음)' >> "$GITHUB_STEP_SUMMARY"
            mkdir -p dist/sheets
          fi

      - name: 사이트 파일 모으기 (최신 외부공개본 → index.html)
        run: |
          FOUND_INSIDE=$( (ls q-page-inside* 2>/dev/null; ls *내부용*.html 2>/dev/null) | head -5 )
          if [ -n "$FOUND_INSIDE" ]; then
            echo "::error::내부용 파일이 저장소에서 발견되었습니다. 즉시 삭제 후 다시 push 하세요."
            echo "$FOUND_INSIDE"
            exit 1
          fi
          LATEST=$(ls q-page-outside_*.html 2>/dev/null | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::q-page-outside_YYYY-MM-DD.html 파일이 저장소 루트에 없습니다."
            exit 1
          fi
          cp "$LATEST" dist/index.html
          [ -f robots.txt ] && cp robots.txt dist/ || true
          touch dist/.nojekyll
          {
            echo "### 배포 산출물"
            echo "- 홈(index)으로 배포된 파일: \`$LATEST\`"
            echo '```'
            du -sh dist dist/sheets 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 우대법령 오버레이 주입 (실패 시 순정본 배포)
        run: |
          PREF_URL="https://gjtjdwns1008-dev.github.io/hrdk-q-radar/pref_export.json"
          if curl -fsSL --retry 3 --retry-delay 5 "$PREF_URL" -o pref_export.json; then
            set +e
            python tools/pref_inject.py dist/index.html pref_export.json dist/index.overlay.html 2>&1 | tee inject.log
            RC=${PIPESTATUS[0]}
            set -e
            {
              echo '### 우대법령 오버레이'
              echo '```'
              tail -20 inject.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$RC" -eq 0 ]; then
              mv dist/index.overlay.html dist/index.html
              echo "오버레이 반영 완료"
            else
              rm -f dist/index.overlay.html
              echo "::warning::오버레이 검산 실패 — 순정본으로 배포합니다(규격 §3 폴백)."
            fi
          else
            echo "::warning::pref_export.json 다운로드 실패 — 순정본으로 배포합니다."
            echo '### 우대법령 오버레이 — 생략(다운로드 실패)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 결과물(dist) 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
